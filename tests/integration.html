<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MiniOS: Tes Integrasi</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #0f172a; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sum { font-weight: 700; margin: 8px 0 16px; }
  .sum.ok { color: #15803d; } .sum.bad { color: #b91c1c; }
  table { border-collapse: collapse; width: 100%; max-width: 980px; font-size: 13px; }
  th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f1f5f9; }
  .PASS { color: #15803d; font-weight: 700; } .FAIL { color: #b91c1c; font-weight: 700; } .SKIP { color: #a16207; font-weight: 700; }
  code { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
  iframe { width: 1px; height: 1px; border: 0; position: absolute; left: -9999px; }
</style>
</head>
<body>
<h1>MiniOS: Tes Integrasi (alur CPU → Memory → Disk lewat event)</h1>
<div>Jalankan lewat server lokal. Halaman ini memuat <code>../index.html</code> di iframe tersembunyi dan menjalankan skenario bagian 12.3 spesifikasi. Perluas skenario di bagian "TAMBAHKAN SKENARIO DI SINI" (tugas QA).</div>
<div id="sum" class="sum">Menjalankan...</div>
<table><thead><tr><th>#</th><th>Langkah</th><th>Hasil</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="app" src="../index.html"></iframe>

<script>
'use strict';
const results = [];
const frame = document.getElementById('app');
let w = null;

function record(name, status, detail) { results.push({ name, status, detail: detail || '' }); }
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function expectEq(actual, expected, label) {
  if (!same(actual, expected)) throw new Error(label + ': diharapkan ' + JSON.stringify(expected) + ', didapat ' + JSON.stringify(actual));
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
async function until(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await wait(50); } return false; }

const faultEvents = [], servedEvents = [];
let skipRest = false;

async function step(name, fn) {
  if (skipRest) { record(name, 'SKIP', 'dilewati karena langkah sebelumnya gagal atau app belum lengkap'); return; }
  try { await fn(); record(name, 'PASS'); }
  catch (e) { record(name, 'FAIL', e.message); skipRest = true; }
}
function dispatchOs(pid, i) { w.dispatchEvent(new w.CustomEvent('os:dispatch', { detail: { pid, start: i * 2, end: i * 2 + 2 } })); }
const PIDS = ['P1', 'P2', 'P3', 'P4'];

async function run() {
  const booted = await until(() => frame.contentWindow && frame.contentWindow.OS && frame.contentWindow.OS.events.some(l => l.includes('MiniOS boot OK')), 8000);
  if (!booted) { record('Boot MiniOS', 'FAIL', 'index.html tidak selesai boot dalam 8 detik'); return; }
  w = frame.contentWindow;
  w.addEventListener('os:page-fault', e => faultEvents.push(e.detail));
  w.addEventListener('os:disk-served', e => servedEvents.push(e.detail));

  await step('1. Aplikasi scheduler, memory, disk terdaftar', async () => {
    const ids = w.OS.apps.map(a => a.id);
    const missing = ['scheduler', 'memory', 'disk'].filter(x => !ids.includes(x));
    if (missing.length) throw new Error('belum terdaftar: ' + missing.join(', '));
    ['scheduler', 'memory', 'disk'].forEach(id => w.Shell.openApp(id));
  });

  await step('2. Reset: tick 0, metrik 0, state memory dan disk kosong', async () => {
    w.OS.reset(); await wait(100);
    expectEq([w.OS.tick, w.OS.metrics], [0, { dispatch: 0, faults: 0, diskOps: 0 }], 'tick dan metrik');
    expectEq(w.OS.getState('memory').pointer, 0, 'memory.pointer');
    expectEq(w.OS.getState('disk').queue, [], 'disk.queue');
  });

  await step('3. 13 dispatch: 7 fault dengan page [7,0,1,2,3,4,0]', async () => {
    faultEvents.length = 0;
    for (let i = 0; i < 13; i++) dispatchOs(PIDS[i % 4], i);
    await wait(100);
    expectEq([w.OS.metrics.dispatch, w.OS.metrics.faults], [13, 7], '(dispatch,faults)');
    expectEq(faultEvents.map(e => e.page), [7, 0, 1, 2, 3, 4, 0], 'page pada os:page-fault');
    expectEq(faultEvents[0].pid, 'P1', 'pid fault pertama');
  });

  await step('4. State memory dan disk setelah 13 dispatch', async () => {
    const m = w.OS.getState('memory'), d = w.OS.getState('disk');
    expectEq([m.pointer, m.faults, m.hits, m.frames], [13, 7, 6, [2, 3, 4, 0]], 'memory (pointer,faults,hits,frames)');
    expectEq([d.queue, d.head], [[70, 0, 10, 20, 30, 40, 0], 53], 'disk (queue,head)');
  });

  await step('5. Service Next sekali: os:disk-served page 7, seek 17', async () => {
    servedEvents.length = 0;
    const win = w.document.querySelector('.window[data-app="disk"]');
    if (!win) throw new Error('jendela Disk tidak terbuka');
    const btn = Array.from(win.querySelectorAll('button')).find(b => b.textContent.includes('Service Next'));
    if (!btn) throw new Error('tombol berlabel "Service Next" tidak ditemukan');
    btn.click(); await wait(100);
    expectEq(servedEvents, [{ pid: 'P1', page: 7, target: 70, seek: 17 }], 'os:disk-served');
    expectEq([w.OS.metrics.diskOps, w.OS.tick], [1, 14], '(diskOps,tick)');
    const d = w.OS.getState('disk');
    expectEq([d.head, d.totalSeek, d.queue], [70, 17, [0, 10, 20, 30, 40, 0]], 'disk (head,totalSeek,queue)');
  });

  await step('6. Jendela Memory ditutup: alur event tetap berjalan', async () => {
    w.Shell.closeApp('memory'); w.OS.reset(); await wait(100);
    for (let i = 0; i < 4; i++) dispatchOs(PIDS[i], i);
    await wait(100);
    expectEq(w.OS.metrics.faults, 4, 'faults');
    expectEq(w.OS.getState('memory').pointer, 4, 'memory.pointer');
  });

  await step('7. Reset akhir mengembalikan semuanya ke awal', async () => {
    w.OS.reset(); await wait(100);
    expectEq([w.OS.tick, w.OS.metrics], [0, { dispatch: 0, faults: 0, diskOps: 0 }], 'tick dan metrik');
    expectEq([w.OS.getState('memory').pointer, w.OS.getState('disk').queue, w.OS.getState('disk').head], [0, [], 53], '(memory.pointer,disk.queue,disk.head)');
  });

  /* ===== TAMBAHKAN SKENARIO DI SINI (tugas QA) =====
     Contoh yang perlu ditambah: ganti algoritma (LRU, SSTF, SCAN) lalu bandingkan hasil,
     input tidak valid di UI, buka-tutup jendela berulang, Compare All tidak mengubah state,
     dan skenario Monitor/Analytics merekam event dengan benar. */
}

function show() {
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  document.getElementById('rows').innerHTML = results.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td class="${r.status}">${r.status}</td><td><code>${esc(r.detail)}</code></td></tr>`).join('');
  const c = (s) => results.filter(r => r.status === s).length;
  const sum = document.getElementById('sum');
  sum.textContent = `PASS ${c('PASS')} · FAIL ${c('FAIL')} · SKIP ${c('SKIP')} dari ${results.length} langkah`;
  sum.className = 'sum ' + (c('FAIL') === 0 && c('SKIP') === 0 ? 'ok' : 'bad');
  document.title = `${c('PASS')}/${results.length} PASS`;
  window.__results = results;
}

frame.addEventListener('load', () => { run().catch(e => record('Kesalahan tes', 'FAIL', e.message)).finally(show); });
</script>
</body>
</html>
